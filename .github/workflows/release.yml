name: Protected Maven Central release

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: realm-central-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  ANDROID_SDK_ROOT: /home/leminity/Android/Sdk
  EMULATOR_RUNTIME_LIB_DIR: /home/leminity/.local/realm-emulator-libs/root/usr/lib/x86_64-linux-gnu

jobs:
  stage:
    name: Stage one USER_MANAGED Central deployment
    if: ${{ github.event.release.prerelease == false && github.event.release.draft == false }}
    environment: maven-central-stage
    runs-on: [self-hosted, linux, api37, ps16k]
    outputs:
      stage_manifest_b64: ${{ steps.stage_manifest.outputs.stage_manifest_b64 }}
      stage_manifest_sha256: ${{ steps.stage_manifest.outputs.stage_manifest_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive
          fetch-depth: 0
      - name: Preflight the trusted API37/ps16k runner contract
        run: |
          set -euo pipefail
          # The runner labels are a scheduling contract; verify the booted
          # device too, and never substitute an API/4KiB image.
          command -v adb >/dev/null
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          adb -s emulator-5654 wait-for-device
          test "$(adb -s emulator-5654 shell getprop ro.build.version.sdk | tr -d '\r')" = 37
          test "$(adb -s emulator-5654 shell getconf PAGE_SIZE | tr -d '\r')" = 16384
          test "$(adb -s emulator-5654 shell getprop ro.boot.qemu.avd_name | tr -d '\r')" = realm-api37-ps16k-kvm
          test "$(adb -s emulator-5654 shell getprop bionic.linker.16kb.app_compat.enabled | tr -d '\r')" = fatal
          test "$(adb -s emulator-5654 shell getprop pm.16kb.app_compat.disabled | tr -d '\r')" = true
      - name: Audit server-side environment reviewer and tag policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          G011_ENVIRONMENT_POLICY_TOKEN: ${{ secrets.G011_ENVIRONMENT_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/maven-central-environment-policy"
          mkdir -p "$policy_dir"
          fetch_policy() {
            local environment="$1" destination="$2"
            local endpoint="https://api.github.com/repos/$GITHUB_REPOSITORY/environments/$environment"
            if curl --fail --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header 'Accept: application/vnd.github+json' "$endpoint" > "$destination"; then return; fi
            # github.token may be unable to read environment protection data.
            # The fallback is an explicitly protected preflight credential,
            # never an assumed/default-pass policy.
            test -n "$G011_ENVIRONMENT_POLICY_TOKEN" || { echo 'environment policy preflight credential is required' >&2; exit 1; }
            curl --fail --silent --show-error --header "Authorization: Bearer $G011_ENVIRONMENT_POLICY_TOKEN" --header 'Accept: application/vnd.github+json' "$endpoint" > "$destination"
          }
          fetch_policy maven-central-stage "$policy_dir/maven-central-stage.json"
          fetch_policy maven-central-release "$policy_dir/maven-central-release.json"
          python3 tools/central-portal.py audit-environment-policy \
            --stage-policy "$policy_dir/maven-central-stage.json" \
            --release-policy "$policy_dir/maven-central-release.json" \
            --audit-file build/maven-central-environment-policy-audit.json
      - name: Bind approved tag to the checked-out source tree
        id: source
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          bash tools/verify-release-tag.sh "$TAG" "$version"
          test "$GITHUB_REF" = "refs/tags/$TAG"
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$(git rev-list -n1 "$TAG")"
          test "$(git rev-parse "${TAG}^{commit}")" = "$commit"
          test -z "$(git status --porcelain --untracked-files=all)"
          core_path=realm/realm-library/src/main/cpp/realm-core
          core_commit="$(git ls-tree "$commit" "$core_path" | awk '{print $3}')"
          test -n "$core_commit"
          test "$(git -C "$core_path" rev-parse HEAD)" = "$core_commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'core_commit=%s\n' "$core_commit" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Download and independently verify exact successful CI evidence
        id: ci_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/g011-ci-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$root"
          mkdir -p "$root/extracted"
          python3 - "$GITHUB_REPOSITORY" "$COMMIT" "$GH_TOKEN" "$root/selection.json" <<'PY'
          import json, sys, urllib.parse, urllib.request
          repository, commit, token, output = sys.argv[1:]
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)
          query = urllib.parse.urlencode({'head_sha': commit, 'status': 'success', 'per_page': 100})
          base = f'https://api.github.com/repos/{repository}'
          runs = get(f'{base}/actions/workflows/ci.yml/runs?{query}').get('workflow_runs', [])
          selected = None
          for run in sorted((item for item in runs if item.get('head_sha') == commit and item.get('conclusion') == 'success'), key=lambda item: int(item['id']), reverse=True):
              artifacts = get(f'{base}/actions/runs/{run["id"]}/artifacts?per_page=100').get('artifacts', [])
              matches = [item for item in artifacts if item.get('name') == f'g011-ci-evidence-{commit}' and not item.get('expired')]
              if len(matches) == 1:
                  selected = {**matches[0], 'run_id': str(run['id'])}
                  break
          if selected is None:
              raise SystemExit('no exact successful unexpired G011 CI artifact for release commit')
          digest = selected.get('digest')
          if not isinstance(digest, str) or not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit('CI artifact lacks an exact SHA-256 digest')
          with open(output, 'w', encoding='utf-8') as destination:
              json.dump(selected, destination, sort_keys=True)
          PY
          artifact_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$root/selection.json")"
          run_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_id"])' "$root/selection.json")"
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_download_url"])' "$root/selection.json")"
          expected_archive_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"].removeprefix("sha256:"))' "$root/selection.json")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            "$archive_url" --output "$root/ci-evidence.zip"
          actual_archive_sha="$(sha256sum "$root/ci-evidence.zip" | awk '{print $1}')"
          test "$actual_archive_sha" = "$expected_archive_sha"
          unzip -q "$root/ci-evidence.zip" -d "$root/extracted"
          mapfile -t runtime_manifests < <(find "$root/extracted" -type f -name 'g011-runtime-*.json' | sort)
          mapfile -t runtime_shas < <(find "$root/extracted" -type f -name 'g011-runtime-*.sha256' | sort)
          mapfile -t evidence_roots < <(find "$root/extracted" -type d -name 'g011-evidence-*' | sort)
          test "${#runtime_manifests[@]}" = 1
          test "${#runtime_shas[@]}" = 1
          test "${#evidence_roots[@]}" = 1
          runtime="${runtime_manifests[0]}"
          runtime_sha_file="${runtime_shas[0]}"
          expected_runtime_sha="$(awk 'NR==1 {print $1} END {if (NR != 1) exit 1}' "$runtime_sha_file")"
          test "$(sha256sum "$runtime" | awk '{print $1}')" = "$expected_runtime_sha"
          python3 tools/g011-evidence-manifest.py --mode baseline \
            --verify evidence/provenance/g011-source-evidence-manifest.json
          python3 tools/g011-evidence-manifest.py --mode runtime \
            --runtime-evidence-dir "${evidence_roots[0]}" --verify "$runtime"
          {
            echo "runtime_provenance=$runtime"
            echo "runtime_provenance_sha256=$expected_runtime_sha"
            echo "ci_artifact_sha256=$actual_archive_sha"
            echo "ci_run_id=$run_id"
            echo "ci_artifact_id=$artifact_id"
          } >> "$GITHUB_OUTPUT"
      - name: Freshly build and locally reverify the exact Central bundle
        env:
          g008SigningKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          g008SigningPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          ./tools/publish_release.sh --signed-bundle
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.commit }}"
          test -z "$(git diff --name-only)"
          python3 tools/central-portal.py verify-bundle --bundle build/g008-maven-central-bundle.zip --source-manifest build/g008-publication-manifest.json
      - name: Create an ephemeral exact-consumer runner
        run: |
          set -euo pipefail
          cat > build/run-g011-consumer.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          url=''; mode=''; home=''; evidence=''; bearer=''
          while [[ $# -gt 0 ]]; do case "$1" in
            --repository-url) url="$2"; shift 2;; --mode) mode="$2"; shift 2;;
            --gradle-user-home) home="$2"; shift 2;; --evidence-dir) evidence="$2"; shift 2;;
            --bearer-env) bearer="$2"; shift 2;; *) exit 2;; esac; done
          args=(--repository-url "$url" --mode "$mode" --gradle-user-home "$home/six" --evidence-dir "$evidence/six")
          [[ -n "$bearer" ]] && args+=(--bearer-env "$bearer")
          tools/g011-consume-six.sh "${args[@]}"
          # Task32 parameterizes the existing AC08 semantic harness; it
          # rejects API/4KiB/AVD/property substitutions rather than falling
          # back to the historical local/offline runner.
          ac08=(--mode validated --repository-url "$url" --bearer-env "$bearer" --sdk-root "$ANDROID_SDK_ROOT" --serial emulator-5654 --expected-avd realm-api37-ps16k-kvm --official-gradle "$G011_OFFICIAL_GRADLE_75" --immutable-encrypted "$G011_OFFICIAL_ENCRYPTED_REALM" --gradle-user-home "$home/ac08" --evidence-dir "$evidence/ac08" --run-id "$GITHUB_RUN_ID")
          compatibility-fixtures/ac08-api37-ps16k-runtime/run-ac08.sh "${ac08[@]}"
          tools/g011-verify-native-elf.sh --bundle build/g008-maven-central-bundle.zip --evidence-dir "$evidence/native-elf" --ndk-root "$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          (
            cd "$evidence"
            rm -f SHA256SUMS checksum-verify.log
            find . -type f ! -name SHA256SUMS ! -name checksum-verify.log -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.tmp
            mv SHA256SUMS.tmp SHA256SUMS
            sha256sum -c SHA256SUMS > checksum-verify.log
          )
          python3 - "$evidence/consumer-evidence.json" "$mode" "$url" "$evidence/SHA256SUMS" <<'PY'
          import hashlib, json, pathlib, sys
          output = pathlib.Path(sys.argv[1]); sums = pathlib.Path(sys.argv[4])
          output.write_text(json.dumps({'format':'realm-maven-central-consumer-evidence-v1','mode':sys.argv[2],'repository_url':sys.argv[3],'exact_six':'PASS','ac08':'PASS','native_elf':'PASS','sha256sums_sha256':hashlib.sha256(sums.read_bytes()).hexdigest()}, sort_keys=True)+'\n')
          PY
          SH
          chmod 700 build/run-g011-consumer.sh
      - name: Upload exactly one USER_MANAGED deployment, validate, and consume it once
        env:
          CENTRAL_PORTAL_BEARER_TOKEN: ${{ secrets.CENTRAL_PORTAL_BEARER_TOKEN }}
          G011_OFFICIAL_GRADLE_75: ${{ vars.G011_OFFICIAL_GRADLE_75 }}
          G011_OFFICIAL_ENCRYPTED_REALM: ${{ vars.G011_OFFICIAL_ENCRYPTED_REALM }}
        run: |
          set -euo pipefail
          python3 tools/central-portal.py stage \
            --bundle build/g008-maven-central-bundle.zip --source-manifest build/g008-publication-manifest.json \
            --tag '${{ github.event.release.tag_name }}' --version '${{ steps.source.outputs.version }}' \
            --commit '${{ steps.source.outputs.commit }}' --core-commit '${{ steps.source.outputs.core_commit }}' \
            --runtime-provenance '${{ steps.ci_evidence.outputs.runtime_provenance }}' \
            --ci-artifact-sha256 '${{ steps.ci_evidence.outputs.ci_artifact_sha256 }}' \
            --ci-run-id '${{ steps.ci_evidence.outputs.ci_run_id }}' \
            --ci-artifact-id '${{ steps.ci_evidence.outputs.ci_artifact_id }}' \
            --environment-policy-audit build/maven-central-environment-policy-audit.json \
            --validated-consumer-command build/run-g011-consumer.sh \
            --validated-consumer-gradle-home "$RUNNER_TEMP/g011-gradle-validated" \
            --validated-consumer-evidence "$RUNNER_TEMP/g011-consumer-validated" \
            --stage-manifest build/maven-central-stage-manifest.json --token-env CENTRAL_PORTAL_BEARER_TOKEN --allow-network
      - name: Expose immutable stage manifest to reviewer-gated release
        id: stage_manifest
        run: |
          set -euo pipefail
          manifest=build/maven-central-stage-manifest.json
          printf 'stage_manifest_sha256=%s\n' "$(sha256sum "$manifest" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'stage_manifest_b64=%s\n' "$(base64 -w0 "$manifest")" >> "$GITHUB_OUTPUT"
      - name: Retain redacted stage and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g011-central-stage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/maven-central-environment-policy-audit.json
            build/maven-central-stage-manifest.json
            build/maven-central-stage-manifest.json.failed.json
            ${{ runner.temp }}/g011-consumer-validated
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Reviewer-gated Central publication
    needs: stage
    environment: maven-central-release
    runs-on: [self-hosted, linux, api37, ps16k]
    steps:
      # Checkout must precede every repo-local tool call in this job.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive
          fetch-depth: 0
      - name: Preflight the trusted API37/ps16k runner contract
        run: |
          set -euo pipefail
          command -v adb >/dev/null
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          adb -s emulator-5654 wait-for-device
          test "$(adb -s emulator-5654 shell getprop ro.build.version.sdk | tr -d '\r')" = 37
          test "$(adb -s emulator-5654 shell getconf PAGE_SIZE | tr -d '\r')" = 16384
          test "$(adb -s emulator-5654 shell getprop ro.boot.qemu.avd_name | tr -d '\r')" = realm-api37-ps16k-kvm
          test "$(adb -s emulator-5654 shell getprop bionic.linker.16kb.app_compat.enabled | tr -d '\r')" = fatal
          test "$(adb -s emulator-5654 shell getprop pm.16kb.app_compat.disabled | tr -d '\r')" = true
      - name: Reconstruct immutable handoff and reverify checked-out source
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_MANIFEST_B64: ${{ needs.stage.outputs.stage_manifest_b64 }}
          STAGE_MANIFEST_SHA256: ${{ needs.stage.outputs.stage_manifest_sha256 }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s' "$STAGE_MANIFEST_B64" | base64 --decode > stage-manifest.json
          test "$(sha256sum stage-manifest.json | awk '{print $1}')" = "$STAGE_MANIFEST_SHA256"
          stage_tag="$(python3 -c 'import json; print(json.load(open("stage-manifest.json"))["tag"])')"
          stage_version="$(python3 -c 'import json; print(json.load(open("stage-manifest.json"))["version"])')"
          commit="$(python3 -c 'import json; print(json.load(open("stage-manifest.json"))["commit"])')"
          core="$(python3 -c 'import json; print(json.load(open("stage-manifest.json"))["core_commit"])')"
          test "$stage_tag" = "$TAG"
          test "$stage_version" = "$(tr -d '[:space:]' < version.txt)"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$commit" = "$(git rev-list -n1 "$TAG")"
          test "$core" = "$(git -C realm/realm-library/src/main/cpp/realm-core rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=no)"
          ci_run_id="$(python3 -c 'import json; print(json.load(open("stage-manifest.json"))["ci_run_id"])')"
          ci_artifact_id="$(python3 -c 'import json; print(json.load(open("stage-manifest.json"))["ci_artifact_id"])')"
          expected_archive_sha="$(python3 -c 'import json; print(json.load(open("stage-manifest.json"))["ci_artifact_sha256"])')"
          expected_runtime_sha="$(python3 -c 'import json; print(json.load(open("stage-manifest.json"))["runtime_provenance"]["sha256"])')"
          root="$RUNNER_TEMP/g011-release-ci-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$root"
          mkdir -p "$root/extracted"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/$ci_run_id" --output "$root/run.json"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/$ci_run_id/artifacts?per_page=100" --output "$root/artifacts.json"
          python3 - "$root/run.json" "$root/artifacts.json" "$commit" "$ci_artifact_id" "$expected_archive_sha" "$root/selection.json" <<'PY'
          import json, sys
          run_path, artifacts_path, commit, artifact_id, expected_sha, output = sys.argv[1:]
          run = json.load(open(run_path, encoding='utf-8'))
          if run.get('head_sha') != commit or run.get('conclusion') != 'success' or run.get('path') != '.github/workflows/ci.yml':
              raise SystemExit('stage manifest CI run is not a successful exact-source CI workflow')
          artifacts = json.load(open(artifacts_path, encoding='utf-8')).get('artifacts', [])
          matches = [item for item in artifacts if str(item.get('id')) == artifact_id]
          if len(matches) != 1:
              raise SystemExit('stage manifest CI artifact ID is not unique in the bound run')
          artifact = matches[0]
          if artifact.get('name') != f'g011-ci-evidence-{commit}' or artifact.get('expired'):
              raise SystemExit('stage manifest CI artifact is missing, expired, or renamed')
          if artifact.get('digest') != f'sha256:{expected_sha}':
              raise SystemExit('stage manifest CI artifact API digest differs')
          json.dump(artifact, open(output, 'w', encoding='utf-8'), sort_keys=True)
          PY
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_download_url"])' "$root/selection.json")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            "$archive_url" --output "$root/ci-evidence.zip"
          test "$(sha256sum "$root/ci-evidence.zip" | awk '{print $1}')" = "$expected_archive_sha"
          unzip -q "$root/ci-evidence.zip" -d "$root/extracted"
          mapfile -t runtime_manifests < <(find "$root/extracted" -type f -name 'g011-runtime-*.json' | sort)
          mapfile -t evidence_roots < <(find "$root/extracted" -type d -name 'g011-evidence-*' | sort)
          test "${#runtime_manifests[@]}" = 1
          test "${#evidence_roots[@]}" = 1
          test "$(sha256sum "${runtime_manifests[0]}" | awk '{print $1}')" = "$expected_runtime_sha"
          python3 tools/g011-evidence-manifest.py --mode baseline \
            --verify evidence/provenance/g011-source-evidence-manifest.json
          python3 tools/g011-evidence-manifest.py --mode runtime \
            --runtime-evidence-dir "${evidence_roots[0]}" --verify "${runtime_manifests[0]}"
      - name: Create fresh Central-only post-publication consumer runner
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/run-g011-central-consumer.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          url=''; mode=''; home=''; evidence=''; expected_aar=''
          while [[ $# -gt 0 ]]; do case "$1" in
            --repository-url) url="$2"; shift 2;; --mode) mode="$2"; shift 2;;
            --gradle-user-home) home="$2"; shift 2;; --evidence-dir) evidence="$2"; shift 2;;
            --expected-realm-android-library-sha256) expected_aar="$2"; shift 2;;
            --bearer-env) echo 'central consumer rejects credentials' >&2; exit 2;; *) exit 2;; esac; done
          [[ "$mode" == central && "$url" == https://repo.maven.apache.org/maven2 ]] || exit 2
          [[ "$expected_aar" =~ ^[0-9a-f]{64}$ ]] || exit 2
          tools/g011-consume-six.sh --mode central --gradle-user-home "$home/six" --evidence-dir "$evidence/six"
          compatibility-fixtures/ac08-api37-ps16k-runtime/run-ac08.sh --mode central --sdk-root "$ANDROID_SDK_ROOT" --serial emulator-5654 --expected-avd realm-api37-ps16k-kvm --official-gradle "$G011_OFFICIAL_GRADLE_75" --immutable-encrypted "$G011_OFFICIAL_ENCRYPTED_REALM" --gradle-user-home "$home/ac08" --evidence-dir "$evidence/ac08" --run-id "$GITHUB_RUN_ID"
          # The fresh Central-only consumer resolved the coordinates above.
          # Download the exact public AAR again from Central, bind it to the
          # immutable stage-manifest digest, and inspect that file -- never a
          # staging-job build path unavailable after this checkout.
          version="$(tr -d '[:space:]' < version.txt)"
          aar="$evidence/realm-android-library-$version.aar"
          mkdir -p "$evidence"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://repo.maven.apache.org/maven2/io/github/leminity/realm/realm-android-library/$version/realm-android-library-$version.aar" \
            --output "$aar"
          printf '%s  %s\n' "$expected_aar" "$aar" | sha256sum -c -
          tools/g011-verify-native-elf.sh --aar "$aar" --evidence-dir "$evidence/native-elf" --ndk-root "$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          (
            cd "$evidence"
            rm -f SHA256SUMS checksum-verify.log
            find . -type f ! -name SHA256SUMS ! -name checksum-verify.log -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.tmp
            mv SHA256SUMS.tmp SHA256SUMS
            sha256sum -c SHA256SUMS > checksum-verify.log
          )
          python3 - "$evidence/consumer-evidence.json" "$url" "$evidence/SHA256SUMS" <<'PY'
          import hashlib, json, pathlib, sys
          output = pathlib.Path(sys.argv[1]); sums = pathlib.Path(sys.argv[3])
          output.write_text(json.dumps({'format':'realm-maven-central-consumer-evidence-v1','mode':'central','repository_url':sys.argv[2],'exact_six':'PASS','ac08':'PASS','native_elf':'PASS','sha256sums_sha256':hashlib.sha256(sums.read_bytes()).hexdigest()}, sort_keys=True)+'\n')
          PY
          SH
          chmod 700 build/run-g011-central-consumer.sh
      - name: Publish exact staged deployment then consume Maven Central freshly
        env:
          CENTRAL_PORTAL_BEARER_TOKEN: ${{ secrets.CENTRAL_PORTAL_BEARER_TOKEN }}
          STAGE_MANIFEST_SHA256: ${{ needs.stage.outputs.stage_manifest_sha256 }}
          G011_OFFICIAL_GRADLE_75: ${{ vars.G011_OFFICIAL_GRADLE_75 }}
          G011_OFFICIAL_ENCRYPTED_REALM: ${{ vars.G011_OFFICIAL_ENCRYPTED_REALM }}
        run: |
          set -euo pipefail
          python3 tools/central-portal.py release \
            --stage-manifest stage-manifest.json --stage-manifest-sha256 "$STAGE_MANIFEST_SHA256" \
            --published-consumer-command build/run-g011-central-consumer.sh \
            --published-consumer-gradle-home "$RUNNER_TEMP/g011-gradle-central" \
            --published-consumer-evidence "$RUNNER_TEMP/g011-consumer-central" \
            --token-env CENTRAL_PORTAL_BEARER_TOKEN --allow-network
