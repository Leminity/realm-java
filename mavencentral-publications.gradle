// Common local-only Maven Central bundle convention for the six G008 artifacts.
// The Sonatype Nexus publishing plugin and every remote repository endpoint are
// intentionally absent. A separate protected release workflow may upload the
// verified bundle, but this build only creates local Maven-layout inputs.
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply from: buildscript.sourceFile.getParent() + "/" + "mavencentral-properties.gradle"

def publicationGroup = rootProject.ext["realmPublicationGroup"]
def publicationVersion = rootProject.ext["realmPublicationVersion"]
def stagingProperty = rootProject.ext["g008StagingRepository"].toString()
def stagingDirectory = stagingProperty.trim()
        ? project.file(stagingProperty)
        : layout.buildDirectory.dir("g008-local-staging").get().asFile

if (project.group.toString() != publicationGroup || project.version.toString() != publicationVersion) {
    throw new GradleException("G008 publication coordinates must be ${publicationGroup}:${publicationVersion}")
}

// Android project dependencies do not always produce correct POM metadata.
// Keep the upstream Kotlin-extensions omission of realm-library: the Gradle
// plugin injects that dependency into consumers instead.
def createPomDependencies(configurationNames) {
    return {
        def dependenciesNode = asNode().appendNode('dependencies')
        def seen = new LinkedHashSet<String>()
        configurationNames.each { configurationName ->
            configurations[configurationName].allDependencies.each {
                if (it.group != null && it.name != null && it.name != 'realm-library') {
                    def dependencyKey = [it.group, it.name, it.version,
                                         it.excludeRules.collect { rule -> "${rule.group}:${rule.module}" }.sort().join(',')].join(':')
                    if (!seen.add(dependencyKey)) {
                        return
                    }
                    def dependencyNode = dependenciesNode.appendNode('dependency')
                    dependencyNode.appendNode('groupId', it.group)
                    dependencyNode.appendNode('artifactId', it.name)
                    dependencyNode.appendNode('version', it.version)

                    if (!it.excludeRules.empty) {
                        def exclusionsNode = dependencyNode.appendNode('exclusions')
                        it.excludeRules.each { rule ->
                            def exclusionNode = exclusionsNode.appendNode('exclusion')
                            exclusionNode.appendNode('groupId', rule.group)
                            exclusionNode.appendNode('artifactId', rule.module)
                        }
                    }
                }
            }
        }
    }
}

def populatePom(publication, pomName, pomDescription, pomDependencies = null) {
    publication.pom {
        name = pomName
        description = pomDescription
        url = 'https://github.com/Leminity/realm-java'
        licenses {
            license {
                name = 'The Apache Software License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        issueManagement {
            system = 'github'
            url = 'https://github.com/Leminity/realm-java/issues'
        }
        scm {
            url = 'https://github.com/Leminity/realm-java'
            connection = 'scm:git:https://github.com/Leminity/realm-java.git'
            developerConnection = 'scm:git:ssh://git@github.com/Leminity/realm-java.git'
        }
        developers {
            developer {
                id = 'leminity'
                name = 'Leminity'
                url = 'https://github.com/Leminity'
            }
        }
    }
    if (pomDependencies) {
        publication.pom.withXml(pomDependencies)
    }
}

publishing {
    repositories {
        maven {
            name = 'g008LocalStaging'
            url = stagingDirectory
        }
    }
}

// Signing is opt-in so an unsigned local smoke remains possible. CI supplies
// only an ephemeral G008 test key through properties/environment; no key is
// committed, logged, or sent to a remote endpoint.
def signingKey = rootProject.ext["g008SigningKey"].toString()
def signingPassword = rootProject.ext["g008SigningPassword"].toString()
if (signingKey.trim()) {
    signing {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    afterEvaluate {
        signing {
            sign publishing.publications
        }
    }
}

// Gradle module metadata is not a Maven Central deployment requirement. Do
// not emit it into the six-artifact allowlisted bundle.
tasks.withType(org.gradle.api.publish.tasks.GenerateModuleMetadata).configureEach {
    enabled = false
}

ext {
    createPomDependencies = this.&createPomDependencies
    populatePom = this.&populatePom
}
