// Modified by Leminity from the upstream Realm Java project.
import com.android.build.api.artifact.SingleArtifact

apply plugin: 'com.android.library'
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'de.undercouch.download'
apply plugin: 'org.jetbrains.dokka'

// TODO How many of these work on Kotlin?
//apply plugin: 'findbugs'
//apply plugin: 'pmd'
//apply plugin: 'checkstyle'
//apply plugin: 'com.github.kt3k.coveralls'
//apply plugin: 'net.ltgt.errorprone'

def properties = new Properties()
properties.load(new FileInputStream("${projectDir}/../../dependencies.list"))

android {
    namespace 'io.realm.kotlin'
    compileSdk rootProject.compileSdkVersion
    buildToolsVersion rootProject.buildToolsVersion
    defaultConfig {
        minSdk rootProject.minSdkVersion
        targetSdk rootProject.targetSdkVersion
        versionName version
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // AGP 9 disables this generated public compatibility class unless it is
    // explicitly requested. Realm 10.19.0 publishes io.realm.kotlin.BuildConfig.
    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            // https://youtrack.jetbrains.com/issue/KT-11333
            // Until this is resolved, enabling code coverage will break extension functions
            // during instrumentation testing.
            testCoverageEnabled = false
        }
        release {
            minifyEnabled false
        }
    }

    flavorDimensions 'api'

    productFlavors {
        base {
            dimension 'api'
        }
        objectServer {
            dimension 'api'
        }
    }

    sourceSets {
        main.kotlin.srcDirs += 'src/main/kotlin'
        androidTest.kotlin.srcDirs += [
                'src/androidTest/kotlin',
                '../realm-library/src/testUtils/kotlin'
        ]
        androidTest.java.srcDirs += ['../realm-library/src/testUtils/java']
        objectServer.kotlin.srcDirs += 'src/objectServer/kotlin'
        androidTestObjectServer.kotlin.srcDirs += [
                'src/androidTestObjectServer/kotlin',
                '../realm-library/src/testUtils/kotlin',
                '../realm-library/src/syncTestUtils/kotlin',
        ]
        androidTestObjectServer.java.srcDirs += [
                '../realm-library/src/testUtils/java',
                '../realm-library/src/syncTestUtils/java',
        ]
    }

    packaging {
        resources {
            excludes += ["META-INF/AL2.0", "META-INF/LGPL2.1"]
        }
    }

    // Required from Kotlin 1.1.2
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

}

// Keep ObjectServer source files, but exclude their unsupported variants from
// the local-DB release task and publication graph.
def baseReleaseAar = objects.fileProperty()

androidComponents {
    beforeVariants(selector().withFlavor('api', 'objectServer')) { variantBuilder ->
        variantBuilder.enable = false
    }
    onVariants(selector().withFlavor('api', 'base').withBuildType('release')) { variant ->
        baseReleaseAar.set(variant.artifacts.get(SingleArtifact.AAR.INSTANCE))
    }
}

base {
    archivesName = "realm-kotlin-extensions"
}

dependencies {
    implementation project(':realm-library')

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_android_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_android_version"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_android_version"
    androidTestImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"

    androidTestImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation "org.mongodb:bson:${properties.getProperty('BSON_DEPENDENCY')}"
    androidTestImplementation 'com.google.code.findbugs:jsr305:3.0.2'
    kaptAndroidTest project(':realm-annotations-processor')
    androidTestImplementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    androidTestObjectServerImplementation 'com.squareup.okhttp3:okhttp:3.9.0'
    androidTestObjectServerImplementation "io.reactivex.rxjava2:rxjava:${properties.getProperty('RXJAVA_DEPENDENCY')}"
}

repositories {
    mavenCentral()
}

// enable @ParametersAreNonnullByDefault annotation. See https://blog.jetbrains.com/kotlin/2017/09/kotlin-1-1-50-is-out/
kotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xjsr305=strict')
    }
}

task sourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    from android.sourceSets.main.kotlin.srcDirs
    archiveClassifier.set('sources')
}

tasks.dokkaHtml.configure {
    outputDirectory.set(file("$buildDir/dokka"))
}

task javadocJar(type: Jar, dependsOn: dokkaHtml) {
    archiveClassifier.set('javadoc')
    from "$buildDir/dokka"
}

apply from: "${rootDir}/../mavencentral-publications.gradle"

publishing {
    publications {
        realm(MavenPublication) {
            groupId 'io.github.leminity.realm'
            artifactId 'realm-android-kotlin-extensions'
            version project.version
            artifact(baseReleaseAar)
            artifact sourcesJar
            artifact javadocJar
            populatePom(
                    it,
                    'realm-android-kotlin-extensions',
                    'Kotlin specific APIs and extension functions for Realm for Android',
                    createPomDependencies(["baseImplementation", "implementation", "baseApi", "api"])
            )
        }
    }
}

artifacts {
    archives javadocJar
    archives sourcesJar
}


// Consumer bytecode transformation is registered by the Realm Gradle plugin.
// Do not invoke the stale implementation while assembling the local-DB artifact
// on AGP 9.
