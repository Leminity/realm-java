apply plugin: 'kotlin'
apply plugin: 'maven-publish'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

def properties = new Properties()
properties.load(new FileInputStream("${projectDir}/../../dependencies.list"))

// Keep the API 37 test classpath lazy and public; do not use Gradle internals
// or a fixed developer-machine SDK path.
def androidSdkRoot = providers.environmentVariable('ANDROID_HOME')
        .orElse(providers.environmentVariable('ANDROID_SDK_ROOT'))
def androidApi37Jar = androidSdkRoot.map { sdkRoot ->
    new File(sdkRoot, 'platforms/android-37.0/android.jar')
}

configurations {
    realmLibraryTestAar
}

dependencies {
    implementation "com.squareup:javawriter:2.5.1"
    implementation "io.realm:realm-annotations:${version}"
    implementation "org.mongodb:bson:${properties.getProperty('BSON_DEPENDENCY')}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    realmLibraryTestAar "io.realm:realm-android-library:${version}@aar"
    testImplementation group:'junit', name:'junit', version:'4.13.1'
    testImplementation group:'com.google.testing.compile', name:'compile-testing', version:'0.21.0'
    testImplementation files(androidApi37Jar)
}

// for Ant filter
import org.apache.tools.ant.filters.ReplaceTokens

def generateVersionClass = tasks.register('generateVersionClass', Copy) {
    from 'src/main/templates/Version.java'
    into 'build/generated-src/main/java/io/realm/processor'
    filter(ReplaceTokens, tokens: [version: version])
    outputs.upToDateWhen { false }
}

// Include the generated Version file
sourceSets {
    main {
        java {
            srcDir 'build/generated-src/main/java'
        }
    }
}

tasks.named('compileKotlin') {
    dependsOn generateVersionClass
}

def realmLibraryTestClasses = layout.buildDirectory.file('realm-library-test-fixture/classes.jar')
def extractRealmLibraryTestClasses = tasks.register('extractRealmLibraryTestClasses', Copy) {
    from { zipTree(configurations.realmLibraryTestAar.singleFile) }
    include 'classes.jar'
    into realmLibraryTestClasses.map { it.asFile.parentFile }
}

dependencies {
    testImplementation files(realmLibraryTestClasses)
}

tasks.named('compileTestJava') {
    dependsOn extractRealmLibraryTestClasses
}

apply from: "${rootDir}/../mavencentral-publications.gradle"

publishing {
    publications {
        realm(MavenPublication) {
            groupId 'io.realm'
            artifactId = 'realm-annotations-processor'
            from components.java
            populatePom(
                it,
                'realm-annotations-processor',
                'Annotation Processor for Realm. Realm is a mobile database: Build better apps, faster.'
            )
        }
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('sourcesJar') {
    dependsOn(generateVersionClass)
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        freeCompilerArgs.add('-XXLanguage:+InlineClasses')
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
tasks.withType(Test) {
    systemProperty "file.encoding", "UTF-8"
    // Work-around for https://github.com/google/compile-testing/issues/222
    jvmArgs(
        "--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",

    )
}
