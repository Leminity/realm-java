def properties = new Properties()
properties.load(new FileInputStream("${projectDir}/../../dependencies.list"))

ext.ccachePath = project.findProperty('ccachePath') ?: System.getenv('NDK_CCACHE')
ext.lcachePath = project.findProperty('lcachePath') ?: System.getenv('NDK_LCACHE')

kapt {
    correctErrorTypes = true
}

android {
    namespace 'io.realm'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        externalNativeBuild {
            cmake {
                if (project.ccachePath) arguments "-DNDK_CCACHE=$project.ccachePath"
                if (project.lcachePath) arguments "-DNDK_LCACHE=$project.lcachePath"
                if (project.hasProperty('buildTargetABIs') && !project.getProperty('buildTargetABIs').trim().isEmpty()) {
                    abiFilters(*project.getProperty('buildTargetABIs').trim().split('\\s*,\\s*'))
                } else {
                    // "armeabi" and "mips" are no longer supported by the NDK
                    abiFilters 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                }

                arguments "-DREALM_JAVA_BUILD_CORE_FROM_SOURCE=${project.hasProperty('buildCore') && project.getProperty('buildCore').toBoolean()}"
                arguments "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${!project.hasProperty('enableLTO') || project.getProperty('enableLTO').toBoolean()}"
                targets "realm-jni"
            }
        }
        // For running test as 32-bit only
        // ndk {
        //    abiFilters 'armeabi-v7a', 'x86'
        // }

        buildConfigField "String", "VERSION_NAME", "\"${version}\""

        buildTypes {
            debug {
                javaCompileOptions.with {
                    annotationProcessorOptions.arguments += ['realm.suppressWarnings': 'false']
                }
            }
        }
    }

    ndkVersion = rootProject.ext.ndkVersion

    externalNativeBuild {
        cmake {
            version = rootProject.ext.cmakeVersion
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        debug {
            // FIXME: If enabled, crashes with https://issuetracker.google.com/issues/37116868
            testCoverageEnabled = false
            // minifyEnabled = true;
            // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            externalNativeBuild {
                cmake {
                }
            }
            // minifyEnabled = true;
        }
    }

    sourceSets {
        testObjectServer {
            kotlin.srcDirs += ['src/testObjectServer/kotlin']
        }
        androidTest {
            kotlin.srcDirs += ['src/androidTest/kotlin', 'src/testUtils/kotlin']
            java.srcDirs += ['src/testUtils/java']
        }
        androidTestObjectServer {
            kotlin.srcDirs += [ 'src/syncIntegrationTest/kotlin',
                                'src/androidTestObjectServer/kotlin',
                                'src/syncTestUtils/kotlin' ]
            java.srcDirs += ['src/syncTestUtils/java']
            assets.srcDirs += ['src/syncIntegrationTest/assets/']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.txt', 'META-INF/LICENSE.txt']
        }
        // We did strip with cmake for release build.
        // Please, Gradle, you are not that smart! Pleas DO NOT strip debug symbols for debug build!
        jniLibs {
            keepDebugSymbols += ['*/*/*.so']
            // Use compressed shared libraries to support 16 KB ELF alignment.
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }

    flavorDimensions 'api'

    productFlavors {
        base {
            dimension 'api'
            externalNativeBuild {
                cmake {
                    arguments "-DREALM_FLAVOR=base"
                }
            }
            consumerProguardFiles 'proguard-rules-consumer-common.pro', 'proguard-rules-consumer-base.pro'
            proguardFiles 'proguard-rules-build-common.pro'
        }
        objectServer {
            dimension 'api'
            externalNativeBuild {
                cmake {
                    arguments "-DREALM_FLAVOR=objectServer"
                }
            }
            consumerProguardFiles 'proguard-rules-consumer-common.pro', 'proguard-rules-consumer-objectServer.pro'
            proguardFiles 'proguard-rules-build-common.pro', 'proguard-rules-build-objectServer.pro'
        }
    }
}

// Stage 5 supports only the local-DB base release. Keep ObjectServer sources in
// the tree, but prevent their variants from entering this build's task graph.
def baseReleaseAar = objects.fileProperty()

androidComponents {
    beforeVariants(selector().withFlavor('api', 'objectServer')) { variantBuilder ->
        variantBuilder.enable = false
    }
    onVariants(selector().withFlavor('api', 'base').withBuildType('release')) { variant ->
        baseReleaseAar.set(variant.artifacts.get(SingleArtifact.AAR.INSTANCE))
        def snapshotHeaders = layout.projectDirectory.dir('src/main/cpp/generated-jni-headers')
        def stagedHeaders = layout.buildDirectory.dir("intermediates/javac/${variant.name}/jni_include")
        def validationHeaders = layout.buildDirectory.dir("generated/jni-headers/${variant.name}/validation")
        def headerManifest = layout.projectDirectory.file('src/main/cpp/generated-jni-headers/SHA256SUMS')

        def stageBaseReleaseJniHeaderSnapshot = tasks.register('stageBaseReleaseJniHeaderSnapshot', Sync) {
            from(snapshotHeaders) {
                include '*.h'
            }
            into(stagedHeaders)
            includeEmptyDirs = false
        }
        variant.lifecycleTasks.registerPreBuild(stageBaseReleaseJniHeaderSnapshot)

        def cleanBaseReleaseJniHeaderValidation = tasks.register('cleanBaseReleaseJniHeaderValidation', Delete) {
            delete(validationHeaders)
        }

        def verifyBaseReleaseJniHeaders = tasks.register('verifyBaseReleaseJniHeaders', VerifyJniHeaders) {
            snapshotDirectory.set(snapshotHeaders)
            manifestFile.set(headerManifest)
            stagedDirectory.set(stagedHeaders)
            validationDirectory.set(validationHeaders)
            outputAar.convention(layout.buildDirectory.file("intermediates/jni-headers/${variant.name}/verified/realm-library.aar"))
            reportFile.set(layout.buildDirectory.file("reports/jni-headers/${variant.name}-parity.txt"))
            outputs.upToDateWhen { false }
            outputs.cacheIf { false }
        }

        // Transforming the public AAR artifact makes its producers prerequisites and
        // makes this verifier the AAR consumed by assemble and publication lifecycles.
        variant.artifacts.use(verifyBaseReleaseJniHeaders)
            .wiredWithFiles(
                { task -> task.inputAar },
                { task -> task.outputAar }
            )
            .toTransform(SingleArtifact.AAR.INSTANCE)

        variant.configureJavaCompileTask { javaCompile ->
            javaCompile.dependsOn(cleanBaseReleaseJniHeaderValidation)
            javaCompile.options.incremental = false
            javaCompile.options.headerOutputDirectory.set(validationHeaders)
        }
    }
}

// Public Android Components/ScopedArtifacts transformer: remove ObjectServer API
// from the only supported local-DB artifact. The legacy consumer transformer stays removed.
io.realm.buildtransformer.RealmBuildTransformer.@Companion.register(
        project,
        'base',
        'io.realm.internal.annotations.ObjectServer',
)

base {
    archivesName = "realm-android-library"
}

// The stale transformer on the buildscript classpath cannot consume AGP 9's
// public DSL. It is consumer-plugin behavior, not library assembly behavior;
// assembleBaseRelease therefore uses only Android Components wiring.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Werror')
}

// AGP 9 built-in Kotlin replaces kotlin-android task configuration.
kotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xjsr305=strict')
    }
}

coveralls.jacocoReportPath = "${buildDir}/reports/coverage/debug/report.xml"

repositories {
    maven { url "https://jitpack.io" }
    mavenCentral()
}

