import java.security.MessageDigest
import com.android.build.api.artifact.SingleArtifact
import org.gradle.api.DefaultTask
import org.gradle.api.GradleException
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.OutputFile
import org.gradle.api.tasks.Delete
import org.gradle.api.tasks.Sync
import org.gradle.api.tasks.TaskAction
import org.gradle.api.tasks.compile.JavaCompile

/** Verifies that the build-only JNI headers exactly match the committed snapshot. */
abstract class VerifyJniHeaders extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getSnapshotDirectory()

    @InputFile
    abstract RegularFileProperty getManifestFile()

    @InputDirectory
    abstract DirectoryProperty getStagedDirectory()

    @InputDirectory
    abstract DirectoryProperty getValidationDirectory()

    // This public AGP artifact Provider carries the complete Java/native producer chain.
    @InputFile
    abstract RegularFileProperty getInputAar()

    @OutputFile
    abstract RegularFileProperty getOutputAar()

    @OutputFile
    abstract RegularFileProperty getReportFile()

    @TaskAction
    void verifyHeaders() {
        Map<String, String> expected = parseManifest(manifestFile.get().asFile)
        verifyDirectory('snapshot', snapshotDirectory.get().asFile, expected)
        verifyDirectory('staged', stagedDirectory.get().asFile, expected)
        verifyDirectory('validation', validationDirectory.get().asFile, expected)

        File report = reportFile.get().asFile
        report.parentFile.mkdirs()
        File inputArtifact = inputAar.get().asFile
        File outputArtifact = outputAar.get().asFile
        outputArtifact.parentFile.mkdirs()
        inputArtifact.withInputStream { input ->
            outputArtifact.withOutputStream { output ->
                input.transferTo(output)
            }
        }
        report.text = 'JNI header parity verified\n' +
            "headers=${expected.size()}\n" +
            "snapshot=${snapshotDirectory.get().asFile}\n" +
            "staged=${stagedDirectory.get().asFile}\n" +
            "validation=${validationDirectory.get().asFile}\n" +
            "inputAar=${inputArtifact}\n" +
            "inputAarSha256=${sha256(inputArtifact)}\n" +
            "outputAar=${outputArtifact}\n" +
            "outputAarSha256=${sha256(outputArtifact)}\n"
    }

    private static Map<String, String> parseManifest(File manifest) {
        Map<String, String> entries = new TreeMap<>()
        manifest.eachLine { line ->
            if (!line.trim()) {
                return
            }
            def match = line =~ /^([0-9a-f]{64})  (.+\.h)$/
            if (!match.matches()) {
                throw new GradleException("Invalid JNI header manifest entry: ${line}")
            }
            if (entries.put(match.group(2), match.group(1)) != null) {
                throw new GradleException("Duplicate JNI header manifest entry: ${match.group(2)}")
            }
        }
        if (entries.size() != 30) {
            throw new GradleException("JNI header manifest must contain exactly 30 entries, found ${entries.size()}: ${manifest}")
        }
        entries
    }

    private static void verifyDirectory(String label, File directory, Map<String, String> expected) {
        Map<String, String> actual = new TreeMap<>()
        directory.listFiles()?.findAll { it.isFile() && it.name.endsWith('.h') }?.each { header ->
            actual.put(header.name, sha256(header))
        }
        if (actual != expected) {
            throw new GradleException("JNI header ${label} inventory or bytes differ from the committed snapshot. Expected ${expected.keySet()}, got ${actual.keySet()}")
        }
    }

    private static String sha256(File file) {
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        file.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        digest.digest().collect { String.format('%02x', it & 0xff) }.join()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'com.github.spotbugs-base'
apply plugin: 'pmd'
apply plugin: 'checkstyle'
apply plugin: 'com.github.kt3k.coveralls'
