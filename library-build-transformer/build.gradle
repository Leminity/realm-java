buildscript {
    def properties = new Properties()
    properties.load(new FileInputStream("${projectDir}/../dependencies.list"))
    ext.kotlin_version = properties.get('KOTLIN')

    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

group = 'io.realm'
version = file("${projectDir}/../version.txt").text.trim()

apply plugin: 'kotlin'
apply plugin: 'java'
apply plugin: 'maven-publish'

repositories {
    google()
    mavenCentral()
}
def properties = new Properties()
properties.load(new FileInputStream("${projectDir}/../dependencies.list"))
dependencies {
    implementation gradleApi()
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-util:9.7.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlin_version}"
    compileOnly "com.android.tools.build:gradle:${properties.get("GRADLE_BUILD_TOOLS")}"

    testImplementation group:'junit', name:'junit', version:'4.12'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

compileKotlin {
    kotlinOptions.jvmTarget = "11"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "11"
}

test {
    // Gradle 9's ProjectBuilder defines synthetic legacy types during these
    // focused task-property tests and requires this JDK 17 module access.
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
}

// This transform helper is build-time only. It remains an io.realm local
// Maven dependency for the nested Realm build and is intentionally excluded
// from the six public G008 publications and staging repository.
publishing {
    publications {
        realm(MavenPublication) {
            groupId 'io.realm'
            artifactId = 'realm-library-build-transformer'
            from components.java
        }
    }
}
