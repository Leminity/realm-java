// Modified by Leminity from the upstream Realm Java project.
// Shared G008 publication configuration. This file deliberately contains no
// Central credentials or remote repository endpoints: staging is always a
// caller-selected local Maven-layout directory.
def getPropertyValue(String propertyName) {
    return project.findProperty(propertyName) ?: System.getenv(propertyName) ?: ""
}

def releaseVersionFile = new File(buildscript.sourceFile.getParentFile(), "version.txt")
if (!releaseVersionFile.isFile()) {
    throw new GradleException("G008 release version file is missing: ${releaseVersionFile}")
}
def releaseVersion = releaseVersionFile.getText("UTF-8").trim()
if (!releaseVersion) {
    throw new GradleException("G008 release version file must not be empty: ${releaseVersionFile}")
}

def rootExt = rootProject.ext
rootExt["realmPublicationGroup"] = "io.github.leminity.realm"
rootExt["realmPublicationVersion"] = releaseVersion
rootExt["g008StagingRepository"] = getPropertyValue("g008StagingRepository")
rootExt["g008SigningKey"] = getPropertyValue("g008SigningKey")
rootExt["g008SigningPassword"] = getPropertyValue("g008SigningPassword")

def expectedPublicationVersion = rootExt["realmPublicationVersion"]
if (project.version != "unspecified" && project.version.toString() != expectedPublicationVersion) {
    throw new GradleException("G008 publication version must be " +
            "${expectedPublicationVersion}, found ${project.version}")
}
