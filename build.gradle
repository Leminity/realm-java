def forkGroupId = 'com.github.leminity.realm-java'
def forkArtifactExtensions = [
        'realm-annotations': 'jar',
        'realm-transformer': 'jar',
        'realm-library-build-transformer': 'jar',
        'realm-android-library': 'aar',
        'realm-annotations-processor': 'jar',
        'realm-android-kotlin-extensions': 'aar',
        'realm-gradle-plugin': 'jar'
]
def forkStageProperties = { GradleBuild build ->
    if (!project.hasProperty('forkRepositoryUrl')) {
        throw new GradleException('forkRepositoryUrl is required')
    }
    if (!project.hasProperty('forkVersion')) {
        throw new GradleException('forkVersion is required')
    }
    def properties = new LinkedHashMap<String, String>()
    properties.putAll(gradle.startParameter.projectProperties)
    properties.put('forkGroup', forkGroupId)
    properties.put('forkRepositoryUrl', project.property('forkRepositoryUrl').toString())
    properties.put('forkVersion', project.property('forkVersion').toString())
    build.startParameter.projectProperties = properties
}

task publishForkAnnotations(type: GradleBuild) {
    group = 'Publishing'
    description = 'Stage 1: publish Local-only Realm annotations.'
    dir = file('realm-annotations')
    tasks = ['publishRealmPublicationPublicationToForkRepository']
    doFirst { forkStageProperties(delegate as GradleBuild) }
}

task publishForkTransformer(type: GradleBuild) {
    group = 'Publishing'
    description = 'Stage 2.1: publish the Realm transformer.'
    dependsOn publishForkAnnotations
    dir = file('realm-transformer')
    tasks = ['publishRealmPublicationPublicationToForkRepository']
    doFirst { forkStageProperties(delegate as GradleBuild) }
}

