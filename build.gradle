    group = 'Publishing'
    description = 'Stage 2.2: publish the Realm library build transformer.'
    dependsOn publishForkTransformer
    dir = file('library-build-transformer')
    tasks = ['publishRealmPublicationPublicationToForkRepository']
    doFirst { forkStageProperties(delegate as GradleBuild) }
}

task publishForkRealmModules(type: GradleBuild) {
    group = 'Publishing'
    description = 'Stages 3.1-3.3: publish the ordered Local-only Realm Android modules in one nested build.'
    dependsOn publishForkBuildTransformer
    dir = file('realm')
    tasks = [
            ':realm-library:publishBasePublicationPublicationToForkRepository',
            ':realm-annotations-processor:publishBasePublicationPublicationToForkRepository',
            ':kotlin-extensions:publishBasePublicationPublicationToForkRepository'
    ]
    doFirst { forkStageProperties(delegate as GradleBuild) }
}

task publishForkGradlePlugin(type: GradleBuild) {
    group = 'Publishing'
    description = 'Stage 4: publish the Realm Gradle plugin.'
    dependsOn publishForkRealmModules
    dir = file('gradle-plugin')
    tasks = ['publishRealmPublicationPublicationToForkRepository']
    doFirst { forkStageProperties(delegate as GradleBuild) }
}

task publishLocalOnlyDistribution {
    group = 'Publishing'
    description = 'Publish the authoritative seven-artifact Local-only distribution in stage order.'
    dependsOn publishForkGradlePlugin
}

def publicationEvidence = file('.omx/evidence/realm-java-android17/publication-contract.json')
def expectedPublicationFiles = providers.gradleProperty('forkRepositoryUrl').zip(
        providers.gradleProperty('forkVersion')) { repositoryUrl, forkVersion ->
    URI uri = URI.create(repositoryUrl)
    if (uri.scheme != null && uri.scheme != 'file') {
        throw new GradleException("forkRepositoryUrl must be a file URI: ${repositoryUrl}")
    }
    File repository = uri.scheme == 'file' ? new File(uri) : file(repositoryUrl)
    forkArtifactExtensions.collectMany { artifactId, extension ->
        File directory = new File(repository,
                "${forkGroupId.replace('.', '/')}/${artifactId}/${forkVersion}")
        [
                new File(directory, "${artifactId}-${forkVersion}.${extension}"),
                new File(directory, "${artifactId}-${forkVersion}.pom"),
                new File(directory, "${artifactId}-${forkVersion}.module")
        ]
    }
}

task verifyPublishedContract(type: Exec) {
    group = 'Verification'
    description = 'Atomically verify all seven fork coordinates, edges, metadata, stages, and checksums.'
    dependsOn publishLocalOnlyDistribution
    inputs.files(expectedPublicationFiles)
    inputs.file(file('gradle/verify_published_contract.py'))
    outputs.file(publicationEvidence)
    doFirst {
        publicationEvidence.parentFile.mkdirs()
        commandLine(
                'python3',
                file('gradle/verify_published_contract.py'),
                '--repository', project.property('forkRepositoryUrl').toString(),
                '--group', forkGroupId,
                '--version', project.property('forkVersion').toString(),
                '--output', publicationEvidence
        )
    }
}

