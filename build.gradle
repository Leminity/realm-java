// Modified by Leminity from the upstream Realm Java project.
buildscript {
    def properties = new Properties()
    properties.load(new FileInputStream("${projectDir}/dependencies.list"))

    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
}

def currentVersion = file("${projectDir}/version.txt").text.trim()

// Shared configuration that copies relevant properties from the root level and parse them on to
// child projects.
def copyProperties = {
    if (project.hasProperty('buildTargetABIs')) {
        // Valid options: armeabi-v7a, arm64-v8a, x86, x86_64
        startParameter.projectProperties += [buildTargetABIs: project.getProperty('buildTargetABIs')]
    }
    if (project.hasProperty('coreSourcePath')) {
        def absolutePath = file(project.getProperty('coreSourcePath')).absolutePath
        startParameter.projectProperties += [coreSourcePath: absolutePath]
    }
    if (project.hasProperty('enableLTO')) {
        startParameter.projectProperties += [enableLTO: project.getProperty('enableLTO')]
    }
    if (project.hasProperty('buildCore')) {
        startParameter.projectProperties += [buildCore: project.getProperty('buildCore')]
    }
    if (project.hasProperty('signBuild')) {
        startParameter.projectProperties += [signBuild: project.getProperty('signBuild')]
    }
    if (project.hasProperty('signPassword')) {
        startParameter.projectProperties += [signPassword: project.getProperty('signPassword')]
    }
    if (project.hasProperty('signSecretRingFile')) {
        startParameter.projectProperties += [signSecretRingFile: project.getProperty('signSecretRingFile')]
    }
}

task assembleAnnotations(type:GradleBuild) {
    group = 'Build'
    description = 'Assemble the Realm annotations'
    dir = file('realm-annotations')
    tasks = ['assemble']
}

task installAnnotations(type:GradleBuild) {
    group = 'Install'
    description = 'Install the jar realm-annotations into mavenLocal()'
    dir = file('realm-annotations')
    tasks = ['publishToMavenLocal']
}

task assembleTransformer(type:GradleBuild) {
    group = 'Build'
    description = 'Assemble the Realm transformer'
    dependsOn installAnnotations
    dir = file('realm-transformer')
    tasks = ['assemble']
}

task installTransformer(type:GradleBuild) {
    group = 'Install'
    description = 'Install the jar realm-transformer into mavenLocal()'
    dependsOn installAnnotations
    dir = file('realm-transformer')
    tasks = ['publishToMavenLocal']
}

task installBuildTransformer(type:GradleBuild) {
    group = 'Install'
    description = 'Install the jar realm-library-build-transformer into mavenLocal()'
    dir = file('library-build-transformer')
    tasks = ['publishToMavenLocal']
}

task assembleRealm(type:GradleBuild) {
    group = 'Build'
    description = 'Assemble the Realm project'
    dependsOn installAnnotations
    dependsOn installTransformer
    dependsOn installBuildTransformer
    dir = file('realm')
    tasks = ['assemble', 'javadocJar', 'sourcesJar']
    configure copyProperties
}

task checkExamples(type:GradleBuild) {
    group = 'Test'
    description = 'Run the JVM tests and checks the examples'
    dir = file('examples')
    tasks = ['check']
    configure copyProperties
}

task checkRealm(type:GradleBuild) {
    group = 'Test'
    description = 'Run the JVM tests and checks Realm project'
    dir = file('realm')
    tasks = ['check']
    configure copyProperties
}

task check {
    group = 'Test'
    description = 'Run the JVM tests and checks in the supported Realm project'
    dependsOn checkRealm
}

task assembleUnitTests(type:GradleBuild) {
    group = 'Build'
    description = 'Assemble Android unit tests of the Realm project'
    dependsOn installTransformer
    dir = file('realm')
    tasks = ['assembleAndroidTest']
    configure copyProperties
}

task connectedUnitTests(type:GradleBuild) {
    group = 'Test'
    description = 'Run the Android unit tests of the Realm project'
    dependsOn installTransformer
    dir = file('realm')
    tasks = ['connectedAndroidTest']
    configure copyProperties
}

task assembleBenchmarks(type:GradleBuild) {
    group = 'Build'
    description = 'Assemble benchmark tests for the library '
    dependsOn installTransformer
    dir = file('library-benchmarks')
    tasks = ['assembleAndroidTest']
    configure copyProperties
}

task connectedBenchmarks(type:GradleBuild) {
    group = 'Test'
    description = 'Run all the benchmark tests for the library '
    dependsOn installTransformer
    dir = file('library-benchmarks')
    tasks = ['connectedAndroidTest']
    configure copyProperties
}

task installRealm(type:GradleBuild) {
    group = 'Install'
    description = 'Install the artifacts of Realm libraries into mavenLocal()'
    dependsOn installTransformer
    dependsOn installBuildTransformer
    dir = file('realm')
    tasks = ['publishToMavenLocal']
    configure copyProperties
}

task assembleGradlePlugin(type:GradleBuild) {
    group = 'Build'
    description = 'Assemble the Realm Gradle plugin'
    dependsOn installRealm
    dependsOn installTransformer
    dir = file('gradle-plugin')
    tasks = ['assemble']
}

task installGradlePlugin(type:GradleBuild) {
    description = 'Install the Realm Gradle plugin into mavenLocal()'
    group = 'Install'
    dependsOn installRealm
    dependsOn installTransformer
    dir = file('gradle-plugin')
    tasks = ['publishToMavenLocal']
}

task installRealmJava(type:Task) {
    dependsOn installGradlePlugin
    dependsOn installRealm
    group = 'Install'
    description = 'Install the Realm library and Gradle plugin into mavenLocal()'
}

task assembleExamples(type:GradleBuild) {
    dependsOn installGradlePlugin
    dependsOn installRealm
    group = 'Build'
    description = 'Assemble the Realm examples'
    dir = file('examples')
    tasks = ['assemble']
}

task monkeyExamples(type:GradleBuild) {
    dependsOn installGradlePlugin
    dependsOn installRealm
    group = 'Build'
    description = 'Run the monkey tests on the Realm examples'
    dir = file('examples')
    tasks = ['monkeyRelease']
}

task javadoc(type:GradleBuild) {
    description = 'Generate the Javadoc Jar for the Realm project'
    group = 'Docs'
    dir = file('realm')
    tasks = ['javadocJar']
    configure copyProperties
}

task sourcesJar(type:GradleBuild) {
    description = 'Generate the sources Jar for the Realm project'
    group = 'Docs'
    dir = file('realm')
    tasks = ['sourcesJar']
    configure copyProperties
}

task assemble {
    group 'Build'
    description = 'Build the supported Realm libraries and Gradle plugin'
    dependsOn assembleRealm
    dependsOn assembleGradlePlugin
}

task distributionJniUnstrippedPackage(type:Zip) {
    description = 'Generate native libs package with debug symbols'

    group = 'Artifact'
    archiveFileName = "realm-java-jni-libs-unstripped-${currentVersion}.zip"
    destinationDirectory = file("${buildDir}/outputs/distribution")

    from("realm/realm-library/build/outputs/jniLibs-unstripped") {
        include '**/*.so'
    }
}

task cleanRealm(type:GradleBuild) {
    description = 'Clean the Realm project'
    group = 'Clean'
    dir = file('realm')
    tasks = ['clean']
    configure copyProperties
}

task cleanGradlePlugin(type:GradleBuild) {
    description = 'Clean the Realm Gradle plugin project'
    group = 'Clean'
    dir = file('gradle-plugin')
    tasks = ['clean']
}

task cleanExamples(type:GradleBuild) {
    description = 'Clean the Realm examples'
    group = 'Clean'
    dir = file('examples')
    tasks = ['clean']
}

task cleanLocalMavenRepos(type:Delete) {
    description = 'Remove any Realm artifacts from the local Maven repositories'
    group = 'Clean'
    delete "${System.env.HOME}/.m2/repository/io/github/leminity/realm"
}

task clean {
    description = 'Perform all the other clean tasks'
    group = 'Clean'
    cleanLocalMavenRepos.dependsOn cleanRealm
    cleanLocalMavenRepos.dependsOn cleanGradlePlugin
    cleanLocalMavenRepos.dependsOn cleanExamples
    dependsOn cleanLocalMavenRepos
}

task manualClean {
    description = 'Clean build files without using clean tasks defined in sub projects'
    group = 'Clean'

    doLast {
        // clean 'build' directories
        exec {
            workingDir "${rootDir}"
            commandLine 'find', '.', '-type', 'd', '-name', 'build', '-print', '-exec', 'rm', '-rf', '{}', ';', '-prune'
        }

        // clean '.externalNativeBuild' directories
        exec {
            workingDir "${rootDir}"
            commandLine 'find', '.', '-type', 'd', '-name', '.externalNativeBuild', '-print', '-exec', 'rm', '-rf', '{}', ';', '-prune'
        }

        // clean '.gradle' directories except one in the root
        exec {
            workingDir "${rootDir}"
            commandLine 'find', '.', '-mindepth', '2', '-type', 'd', '-name', '.gradle', '-print', '-exec', 'rm', '-rf', '{}', ';', '-prune'
        }

        // clean ${System.env.HOME}/.m2/repository/io/github/leminity/realm
        exec {
            workingDir "${rootDir}"
            commandLine 'sh', '-c', "echo \"${System.env.HOME}/.m2/repository/io/github/leminity/realm\" && rm -rf \"${System.env.HOME}/.m2/repository/io/github/leminity/realm\""
        }
    }
}

// G008 creates a complete, local Maven-layout staging repository. It never
// contacts a publication service; a protected release workflow is responsible
// for any later Central Portal upload of the verified bundle.
def g008StagingRepository = file(project.findProperty('g008StagingRepository') ?: System.getenv('g008StagingRepository') ?: "$buildDir/g008-local-staging")
def g008Manifest = file(project.findProperty('g008ManifestFile') ?: System.getenv('g008ManifestFile') ?: "$buildDir/g008-publication-manifest.json")
def g008BundleFile = file(project.findProperty('g008BundleFile') ?: System.getenv('g008BundleFile') ?: "$buildDir/g008-maven-central-bundle.zip")

def configureG008NestedBuild = {
    startParameter.projectProperties = new LinkedHashMap(gradle.startParameter.projectProperties)
    startParameter.projectProperties.put('g008StagingRepository', g008StagingRepository.absolutePath)
}

task cleanG008LocalStaging(type: Delete) {
    group = 'Publishing'
    description = 'Remove only the caller-selected G008 local staging directory before a fresh publication run'
    delete g008StagingRepository
}

task g008PublishAnnotations(type: GradleBuild) {
    group = 'Publishing'
    description = 'Publish realm-annotations to the G008 local staging repository'
    dependsOn cleanG008LocalStaging
    dir = file('realm-annotations')
    tasks = ['publishRealmPublicationToG008LocalStagingRepository']
    configure copyProperties
    configure configureG008NestedBuild
}

task g008PublishTransformer(type: GradleBuild) {
    group = 'Publishing'
    description = 'Publish realm-transformer to the G008 local staging repository'
    dependsOn g008PublishAnnotations
    dir = file('realm-transformer')
    tasks = ['publishRealmPublicationToG008LocalStagingRepository']
    configure copyProperties
    configure configureG008NestedBuild
}

task g008PublishRealm(type: GradleBuild) {
    group = 'Publishing'
    description = 'Publish the base library, processor, and Kotlin extensions to G008 local staging'
    dependsOn g008PublishTransformer
    dependsOn installBuildTransformer
    dir = file('realm')
    tasks = [
            ':realm-annotations-processor:publishRealmPublicationToG008LocalStagingRepository',
            ':realm-library:publishBasePublicationPublicationToG008LocalStagingRepository',
            ':kotlin-extensions:publishRealmPublicationToG008LocalStagingRepository'
    ]
    configure copyProperties
    configure configureG008NestedBuild
}

task g008PublishGradlePlugin(type: GradleBuild) {
    group = 'Publishing'
    description = 'Publish realm-gradle-plugin to the G008 local staging repository'
    dependsOn g008PublishRealm
    dir = file('gradle-plugin')
    // java-gradle-plugin also creates marker publications. The fork contract
    // releases only the explicit realm-gradle-plugin coordinate.
    tasks = ['publishRealmPublicationToG008LocalStagingRepository']
    configure copyProperties
    configure configureG008NestedBuild
}

task g008PublishLocal {
    group = 'Publishing'
    description = 'Publish exactly the six public G008 artifacts to a local Maven-layout repository'
    dependsOn g008PublishGradlePlugin
}

def runG008Command = { List<String> arguments ->
    // Gradle 9 no longer exposes exec() on a task action. ProviderFactory.exec
    // is the public, lazy command-execution API and retains the task's process
    // environment for ephemeral signing-key and local-staging verification.
    project.providers.exec { spec ->
        spec.commandLine(*arguments)
    }.result.get().assertNormalExitValue()
}

task g008VerifyLocalStaging {
    group = 'Verification'
    description = 'Validate the unsigned exact-six local staging tree, POM graph, checksums, and isolated consumer'
    dependsOn g008PublishLocal
    doLast {
        runG008Command([
                'python3', 'tools/g008-publication.py',
                '--repository', g008StagingRepository.absolutePath,
                '--write-checksums', '--manifest', g008Manifest.absolutePath,
                '--plugin-source', 'gradle-plugin/src/main/kotlin/io/realm/gradle/Realm.kt'
        ])
        runG008Command([
                'bash', 'tools/g008-clean-consumer.sh',
                '--repository', g008StagingRepository.absolutePath
        ])
    }
}

task g008Bundle {
    group = 'Publishing'
    description = 'Create a signed deterministic Maven Central-format G008 bundle from local staging'
    dependsOn g008VerifyLocalStaging
    doLast {
        runG008Command([
                'python3', 'tools/g008-publication.py',
                '--repository', g008StagingRepository.absolutePath,
                '--require-signatures', '--manifest', g008Manifest.absolutePath,
                '--bundle', g008BundleFile.absolutePath,
                '--plugin-source', 'gradle-plugin/src/main/kotlin/io/realm/gradle/Realm.kt'
        ])
    }
}
