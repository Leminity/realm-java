buildscript {
    def properties = new Properties()
    properties.load(new FileInputStream("${projectDir}/../dependencies.list"))

    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "io.github.gradle-nexus:publish-plugin:${properties.get("GRADLE_NEXUS_PLUGIN")}"
    }
}

apply plugin: 'java'
apply plugin: 'maven-publish'

def distributionGroup = project.findProperty('forkGroup') ?: 'io.realm'
def distributionVersion = project.findProperty('forkVersion') ?: file("${projectDir}/../version.txt").text.trim()

group = distributionGroup
version = distributionVersion

apply from: "${rootDir}/../mavencentral-publications.gradle"
if (project.hasProperty('enableMavenCentralPublishing')) {
    apply from: "${rootDir}/../mavencentral-publish.gradle"
}

publishing {
    publications {
        realmPublication(MavenPublication) {
            groupId 'io.realm'
            artifactId = 'realm-annotations'
            from components.java
            populatePom(
                    it,
                    'realm-annotations',
                    'Annotations for Realm. Realm is a mobile database: Build better apps, faster.'
            )
        }
    }
}

ext.forkPublicationConfig = [
        publicationName: 'realmPublication',
        artifactId: 'realm-annotations',
        dependencies: []
]
apply from: "${rootDir}/../fork-publication.gradle"

java {
    withSourcesJar()
    withJavadocJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

javadoc {
    options.encoding = 'UTF-8'
}
