def forkRepository = providers.gradleProperty('forkRepository').orNull
if (forkRepository == null || forkRepository.trim().isEmpty()) {
    throw new GradleException('AC-07 requires -PforkRepository=<local G008 Maven-layout directory>')
}

buildscript {
    repositories {
        maven { url uri(forkRepository) }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'io.github.leminity.realm:realm-gradle-plugin:10.19.0-agp9.3'
    }
}
