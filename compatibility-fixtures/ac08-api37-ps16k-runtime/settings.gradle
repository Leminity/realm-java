pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

def g008Repository = System.getenv('G008_STAGING_REPOSITORY') ?:
        'file:///mnt/d/workspace/jiran/realm/build/g008-root-final-stage-run1'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
