import groovy.json.JsonOutput
import java.security.MessageDigest

// Fork-only publication adapter. Upstream io.realm publications remain unchanged unless both
// forkRepositoryUrl and forkVersion are supplied by the root distribution orchestrator.
if (!project.hasProperty('forkRepositoryUrl') || !project.hasProperty('forkVersion')) {
    return
}

if (!project.ext.has('forkPublicationConfig')) {
    throw new GradleException("forkPublicationConfig must be defined before applying fork-publication.gradle")
}

def config = project.ext.forkPublicationConfig
def forkGroupId = project.findProperty('forkGroup') ?: 'com.github.leminity.realm-java'
def forkVersionName = project.property('forkVersion').toString()
def forkRepository = project.uri(project.property('forkRepositoryUrl'))
def publicationName = config.publicationName.toString()
def artifactId = config.artifactId.toString()
def forkDependencies = (config.dependencies ?: []).collect { it.toString() }

project.group = forkGroupId
project.version = forkVersionName

repositories {
    maven {
        name = 'ForkDependencies'
        url = forkRepository
    }
}

publishing {
    repositories {
        maven {
            name = 'Fork'
            url = forkRepository
        }
    }
}

def forkPublication = publishing.publications.named(publicationName, MavenPublication)
forkPublication.configure { publication ->
    publication.groupId = forkGroupId
    publication.artifactId = artifactId
    publication.version = forkVersionName

    // Keep external dependencies generated by the existing publication, but normalize every
    // Realm-internal edge to the atomic fork coordinate graph.
    publication.pom.withXml {
        Node root = asNode()
        Node dependenciesNode = root.dependencies ? root.dependencies[0] : root.appendNode('dependencies')
        dependenciesNode.dependency.findAll { dependency ->
            def dependencyGroup = dependency.groupId?.text()
            dependencyGroup == 'io.realm' || dependencyGroup == forkGroupId
        }.each { dependency ->
            dependenciesNode.remove(dependency)
        }
        forkDependencies.each { dependencyArtifact ->
            Node dependency = dependenciesNode.appendNode('dependency')
            dependency.appendNode('groupId', forkGroupId)
            dependency.appendNode('artifactId', dependencyArtifact)
            dependency.appendNode('version', forkVersionName)
            dependency.appendNode('scope', 'compile')
        }
    }
}

if (config.aarFile) {
    File aarFile = project.file(config.aarFile)
    def moduleMetadataFile = project.layout.buildDirectory.file(
            "fork-publication/${artifactId}-${forkVersionName}.module")

    def digest = { File file, String algorithm ->
        MessageDigest messageDigest = MessageDigest.getInstance(algorithm)
        file.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                messageDigest.update(buffer, 0, read)
            }
        }
        messageDigest.digest().encodeHex().toString()
    }

    def metadataTaskName = "generate${artifactId.split('-').collect { it.capitalize() }.join('')}ForkModuleMetadata"
    def generateModuleMetadata = tasks.register(metadataTaskName) {
        dependsOn config.builtBy
        inputs.file aarFile
        outputs.file moduleMetadataFile
        doLast {
            if (!aarFile.isFile()) {
                throw new GradleException("Missing fork AAR input: ${aarFile}")
            }
            File output = moduleMetadataFile.get().asFile
            output.parentFile.mkdirs()
            String publishedAarName = "${artifactId}-${forkVersionName}.aar"
            def dependencyEntries = forkDependencies.collect { dependencyArtifact ->
                [
                        group: forkGroupId,
                        module: dependencyArtifact,
                        version: [requires: forkVersionName]
                ]
            }
            def publishedFile = [
                    name: publishedAarName,
                    url: publishedAarName,
                    size: aarFile.length(),
                    sha512: digest(aarFile, 'SHA-512'),
                    sha256: digest(aarFile, 'SHA-256'),
                    sha1: digest(aarFile, 'SHA-1'),
                    md5: digest(aarFile, 'MD5')
            ]
            def variant = { String name, String usage ->
                [
                        name: name,
                        attributes: [
                                'org.gradle.category': 'library',
                                'org.gradle.dependency.bundling': 'external',
                                'org.gradle.libraryelements': 'aar',
                                'org.gradle.status': 'release',
                                'org.gradle.usage': usage
                        ],
                        dependencies: dependencyEntries,
                        files: [publishedFile]
                ]
            }
            def metadata = [
                    formatVersion: '1.1',
                    component: [
                            group: forkGroupId,
                            module: artifactId,
                            version: forkVersionName,
                            attributes: ['org.gradle.status': 'release']
                    ],
                    createdBy: [gradle: [version: gradle.gradleVersion]],
                    variants: [
                            variant('releaseApiElements', 'java-api'),
                            variant('releaseRuntimeElements', 'java-runtime')
                    ]
            ]
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + System.lineSeparator()
        }
    }

    forkPublication.configure { publication ->
        publication.artifact(moduleMetadataFile) {
            extension = 'module'
            builtBy generateModuleMetadata
        }
    }
}
